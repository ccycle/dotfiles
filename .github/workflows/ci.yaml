name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  check:
    name: Lint & Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: cachix/cachix-action@v14
        with:
          name: ccycle

      # Mock generated/env.nix to ensure pure evaluation
      - run: |
          mkdir -p generated
          echo '{ username = "runner"; homeDirectory = "/home/runner"; }' > generated/env.nix

      - run: nix flake check --all-systems --impure --no-update-lock-file

  build-home:
    name: Build Home Manager
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: cachix/cachix-action@v14
        with:
          name: ccycle

      - run: |
          mkdir -p generated
          if [ "${{ runner.os }}" = "macOS" ]; then
             echo '{ username = "runner"; homeDirectory = "/Users/runner"; }' > generated/env.nix
          else
             echo '{ username = "runner"; homeDirectory = "/home/runner"; }' > generated/env.nix
          fi

      - run: |
          SYSTEM=$(nix eval --raw --impure --expr 'builtins.currentSystem')
          echo "Building for system: $SYSTEM"
          nix build .#homeConfigurations.private.${SYSTEM}.activationPackage --impure --no-update-lock-file

      - uses: cachix/cachix-action@v14
        with:
          name: ccycle
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

  build-darwin:
    name: Build Darwin System
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: cachix/cachix-action@v14
        with:
          name: ccycle

      - run: |
          mkdir -p generated
          echo '{ username = "runner"; homeDirectory = "/Users/runner"; }' > generated/env.nix

      - run: |
          SYSTEM=$(nix eval --raw --impure --expr 'builtins.currentSystem')
          echo "Building for system: $SYSTEM"
          nix build .#darwinConfigurations.private.${SYSTEM}.system --impure --no-update-lock-file

      - uses: cachix/cachix-action@v14
        with:
          name: ccycle
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
