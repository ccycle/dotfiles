name: CI

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'issues/**'
      - 'skills/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'issues/**'
      - 'skills/**'
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: cachix/cachix-action@v14
        with:
          name: ccycle
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      # Mock generated/env.nix to ensure pure evaluation
      - run: |
          mkdir -p generated
          echo '{ username = "runner"; homeDirectory = "/home/runner"; }' > generated/env.nix

      - run: nix flake check --impure --no-update-lock-file

  build:
    name: Build macOS (Home + Darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: cachix/cachix-action@v14
        with:
          name: ccycle
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - run: |
          mkdir -p generated
          echo '{ username = "runner"; homeDirectory = "/Users/runner"; }' > generated/env.nix

      - name: Build all configurations
        run: |
          SYSTEM=$(nix eval --raw --impure --expr 'builtins.currentSystem')
          echo "Building for system: $SYSTEM"
          cachix watch-exec ccycle -- nix build .#homeConfigurations.private.${SYSTEM}.activationPackage --impure --no-update-lock-file
          cachix watch-exec ccycle -- nix build .#darwinConfigurations.private.${SYSTEM}.system --impure --no-update-lock-file
          cachix watch-exec ccycle -- nix build .#darwinConfigurations.mac-mini-m4.system --impure --no-update-lock-file
