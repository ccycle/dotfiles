name: pocket-id

services:
  pocket-id:
    # Pinned to a version past all published GHSA advisories at time of
    # writing (client-credentials audience confusion, fixed in v2.10.0;
    # see design.md). Do not switch to a floating tag for this service.
    image: ghcr.io/pocket-id/pocket-id:v2.11.0
    ports:
      - "127.0.0.1:${POCKET_ID_HOST_PORT:-1411}:1411"
    environment:
      APP_URL: ${POCKET_ID_APP_URL}
      TRUST_PROXY: "true"
      # Lives inside the /app/data bind mount rather than its own separate
      # bind mount source: OrbStack auto-vivifies a standalone bind-mount
      # source as an empty VM-internal directory unless it is written in
      # resolved realpath form (/private/var/...), while a file inside a
      # directory that is already a host bind mount (this one) is always
      # visible - see design.md.
      ENCRYPTION_KEY_FILE: /app/data/encryption_key
      # Passkey-only posture: no email-based bypass of WebAuthn, for the
      # unauthenticated self-service path or the admin-assisted path.
      EMAIL_ONE_TIME_ACCESS_AS_UNAUTHENTICATED_ENABLED: "false"
      EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED: "false"
      # Single-owner homelab: no open or token-gated signups.
      ALLOW_USER_SIGNUPS: disabled
    volumes:
      # Source must be the realpath form (/private/var/..., not /var/...):
      # OrbStack only treats a resolved-realpath bind source as a host share
      # via virtiofs; the /var -> /private/var symlink form mounts instead as
      # a VM-internal overlay dir. POCKET_ID_DATA_DIR is exported as
      # cfg.dataDir (already realpath) by the launchd script, so this default
      # only matters when the compose file is used standalone.
      - ${POCKET_ID_DATA_DIR:-/private/var/lib/pocket-id/data}:/app/data
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 90s
      timeout: 5s
      retries: 2
      start_period: 10s
    restart: always
