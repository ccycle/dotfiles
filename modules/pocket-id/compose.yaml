name: pocket-id

services:
  pocket-id:
    # Pinned to a version past all published GHSA advisories at time of
    # writing (client-credentials audience confusion, fixed in v2.10.0;
    # see design.md). Do not switch to a floating tag for this service.
    image: ghcr.io/pocket-id/pocket-id:v2.11.0
    ports:
      - "127.0.0.1:${POCKET_ID_HOST_PORT:-1411}:1411"
    environment:
      APP_URL: ${POCKET_ID_APP_URL}
      TRUST_PROXY: "true"
      # Read from a tiny read-only bind of the host realpath key file, not
      # from the SQLite volume: the DB lives on a Docker named volume (VM
      # internal, safe for SQLite), while the encryption key is a single,
      # small, read-only file whose virtiofs bind is reliable. See design.md.
      ENCRYPTION_KEY_FILE: /app/encryption_key
      # Passkey-only posture: no email-based bypass of WebAuthn, for the
      # unauthenticated self-service path or the admin-assisted path.
      EMAIL_ONE_TIME_ACCESS_AS_UNAUTHENTICATED_ENABLED: "false"
      EMAIL_ONE_TIME_ACCESS_AS_ADMIN_ENABLED: "false"
      # Single-owner homelab: no open or token-gated signups.
      ALLOW_USER_SIGNUPS: disabled
    volumes:
      # Named volume for the SQLite DB and uploads: stored inside the OrbStack
      # VM (Docker-managed), so SQLite is never on virtiofs/FUSE and is immune
      # to the shared-memory-lock crashes this module saw with a host bind.
      - pocket-id-data:/app/data
      # Single-file, read-only bind of the host encryption key. Source is the
      # resolved-realpath form (/private/var/..., not /var/...): OrbStack only
      # treats a resolved-realpath bind source as a host share via virtiofs.
      # Exported as cfg.keyDir/encryption_key by the launchd script.
      - ${POCKET_ID_KEY_FILE:-/private/var/lib/pocket-id/encryption_key}:/app/encryption_key:ro
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 90s
      timeout: 5s
      retries: 2
      start_period: 10s
    restart: always

volumes:
  pocket-id-data:
    name: pocket-id-data
