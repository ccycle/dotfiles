onboarding = false

[theme]
name = "terminal"
auto_switch = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
mouse_capture = true

[session]
resume_agents_on_restore = true

[keys]
remove_worktree = "prefix+d"
open_notification_target = "prefix+shift+o"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

# Server-wide scratch memo for topics to hand to agents later.
# prefix+n is taken by the default next-tab binding.
# Popup position is fixed (centered); only width/height are configurable.
[[keys.command]]
key = "prefix+m"
type = "popup"
command = 'vi "$HOME/Obsidian/zettelkasten/herdr-memo.md"'
width = "70%"
height = "70%"

[[keys.command]]
key = "prefix+o"
type = "popup"
width = "80%"
height = "60%"
command = '''
workspace=$({
  printf 'STATUS\tWORKSPACE\tREPOSITORY\tBRANCH\tID\tPANE\n'
  herdr api snapshot | jq -r '.result.snapshot as $s | $s.workspaces[] | . as $w
    | [$s.layouts[] | select(.tab_id == $w.active_tab_id) | .focused_pane_id][0] as $active_pane
    | [$s.panes[] | select(.pane_id == $active_pane) | .cwd][0] as $active_cwd
    | ([$s.panes[] | select(.workspace_id == $w.workspace_id and .agent != null) | .pane_id][0] // $active_pane) as $preview_pane
    | [.agent_status, .workspace_id, .label, (.worktree.repo_name // "-"), (.worktree.checkout_path // $active_cwd // "-"), $preview_pane] | @tsv' |
    while IFS=$'\t' read -r agent_status id label repo dir preview_pane; do
      branch=-
      if toplevel=$(git -C "$dir" rev-parse --show-toplevel 2>/dev/null); then
        [ "$repo" != - ] || repo=${toplevel##*/}
        branch=$(git -C "$dir" branch --show-current)
        [ -n "$branch" ] || branch=detached
      fi
      printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$agent_status" "$label" "$repo" "$branch" "$id" "$preview_pane"
    done
} | column -t -s "$(printf '\t')" |
  sed -E \
    -e "s/^STATUS +/$(printf '\033[90m·\033[0m') /" \
    -e "s/^blocked +/$(printf '\033[31m●\033[0m') /" \
    -e "s/^working +/$(printf '\033[33m●\033[0m') /" \
    -e "s/^done +/$(printf '\033[32m●\033[0m') /" \
    -e "s/^[a-z]+ +/$(printf '\033[90m●\033[0m') /" |
  fzf --ansi --height 100% --layout=reverse --border --header-lines=1 --with-nth=..-3 \
      --preview 'herdr pane read {-1} --lines 40 --format ansi' --preview-window=down:60%:wrap:follow |
  awk '{print $(NF-1)}')
[ -n "$workspace" ] && herdr workspace focus "$workspace"
'''

# Put workspaces whose labels share a prefix next to each other.
[[keys.command]]
key = "prefix+a"
type = "shell"
command = "$HOME/.config/herdr/scripts/group-workspaces.sh"

[[keys.command]]
key = "prefix+i"
type = "popup"
width = "90%"
height = "80%"
command = '''
pane=$(herdr agent list | jq -r '.result.agents
  | map(select(.agent_status == "blocked" or .agent_status == "done"))
  | sort_by(.agent_status != "blocked", .state_change_seq) | .[]
  | "\(.pane_id)\t\(.agent_status)\t\(.name // .terminal_title_stripped)"' \
  | fzf --height 100% --layout=reverse --border --delimiter='\t' --with-nth=2.. \
        --preview 'herdr agent read {1} --lines 30' --preview-window=right:70%:wrap \
  | cut -f1)
[ -n "$pane" ] && herdr agent focus "$pane"
'''
