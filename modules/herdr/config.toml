onboarding = false

[theme]
name = "terminal"
auto_switch = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
mouse_capture = true

[session]
resume_agents_on_restore = true

[keys]
remove_worktree = "prefix+d"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

[[keys.command]]
key = "prefix+w"
type = "shell"
command = '''
path=$(herdr worktree list | jq -r '.result.worktrees[] | select(.is_linked_worktree) | "\(.branch // \"detached\")\t\(.path)"' | fzf --height 40% --layout=reverse --border --with-nth=1 | awk -F'\t' '{print $2}')
[ -n "$path" ] && herdr worktree open --path "$path" --focus
'''

[[keys.command]]
key = "prefix+b"
type = "shell"
command = "herdr plugin action invoke open-split --plugin zenbu-labs.terminal-browser"

[[keys.command]]
key = "prefix+c"
type = "shell"
command = "herdr plugin action invoke open-split --plugin zenbu-labs.tode"
