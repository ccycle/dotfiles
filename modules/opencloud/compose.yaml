name: opencloud

services:
  opencloud:
    image: opencloudeu/opencloud-rolling:latest
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["-c", "opencloud init --insecure true || true; opencloud server"]
    ports:
      - "127.0.0.1:9200:9200"
      # Prometheus metrics live on the debug port, not 9200
      # (https://doc.owncloud.com/ocis/next/admin/monitoring/prometheus.html).
      - "127.0.0.1:9205:9205"
    environment:
      OC_URL: ${OPENCLOUD_URL}
      PROXY_TLS: "false"
      OC_INSECURE: "true"
      IDM_ADMIN_PASSWORD: "${OPENCLOUD_ADMIN_PASSWORD}"
      OC_LOG_LEVEL: info
      STORAGE_USERS_DRIVER: posix
      STORAGE_USERS_ID_CACHE_STORE: nats-js-kv
      STORAGE_METADATA_DRIVER: ocis
      PROXY_DEBUG_ADDR: "0.0.0.0:9205"
      # External OIDC (Pocket ID)
      OC_OIDC_ISSUER: ${OPENCLOUD_OIDC_ISSUER}
      IDP_DOMAIN: ${OPENCLOUD_OIDC_DOMAIN}
      IDP_ISSUER_URL: ${OPENCLOUD_OIDC_ISSUER}
      OC_EXCLUDE_RUN_SERVICES: idp
      PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: jwt
      PROXY_OIDC_REWRITE_WELLKNOWN: "true"
      PROXY_USER_OIDC_CLAIM: preferred_username
      PROXY_USER_CS3_CLAIM: username
      PROXY_AUTOPROVISION_ACCOUNTS: "true"
      PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
      GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"
    volumes:
      - ${OPENCLOUD_CONFIG_DIR:-/var/lib/opencloud/config}:/etc/opencloud
      - ${OPENCLOUD_DATA_DIR:-/var/lib/opencloud/data}:/var/lib/opencloud
    extra_hosts:
      - "${OPENCLOUD_HOST_DOMAIN}:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
