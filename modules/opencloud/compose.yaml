name: opencloud

services:
  opencloud:
    image: opencloudeu/opencloud-rolling:latest
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["-c", "opencloud init --insecure true || true; opencloud server"]
    ports:
      - "127.0.0.1:9200:9200"
      # Prometheus metrics live on the debug port, not 9200
      # (https://doc.owncloud.com/ocis/next/admin/monitoring/prometheus.html).
      - "127.0.0.1:9205:9205"
    environment:
      OC_URL: ${OPENCLOUD_URL}
      PROXY_TLS: "false"
      OC_INSECURE: "true"
      IDM_ADMIN_PASSWORD: "${OPENCLOUD_ADMIN_PASSWORD}"
      OC_LOG_LEVEL: info
      STORAGE_USERS_DRIVER: posix
      STORAGE_USERS_ID_CACHE_STORE: nats-js-kv
      STORAGE_USERS_POSIX_ROOT: /host/user-files
      STORAGE_USERS_POSIX_PERSONAL_SPACE_PATH_TEMPLATE: "{{.User.Username}}"
      STORAGE_METADATA_DRIVER: ocis
      PROXY_DEBUG_ADDR: "0.0.0.0:9205"
      # External OIDC (Pocket ID)
      OC_OIDC_ISSUER: ${OPENCLOUD_OIDC_ISSUER}
      PROXY_OIDC_ISSUER: ${OPENCLOUD_OIDC_ISSUER}
      IDP_DOMAIN: ${OPENCLOUD_OIDC_DOMAIN}
      IDP_ISSUER_URL: ${OPENCLOUD_OIDC_ISSUER}
      OC_EXCLUDE_RUN_SERVICES: idp
      PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD: jwt
      PROXY_OIDC_REWRITE_WELLKNOWN: "true"
      PROXY_OIDC_CLIENT_ID: ${OPENCLOUD_OIDC_PROXY_CLIENT_ID}
      PROXY_USER_OIDC_CLAIM: preferred_username
      PROXY_USER_CS3_CLAIM: username
      PROXY_AUTOPROVISION_ACCOUNTS: "true"
      PROXY_AUTOPROVISION_CLAIM_USERNAME: preferred_username
      PROXY_AUTOPROVISION_CLAIM_EMAIL: email
      PROXY_AUTOPROVISION_CLAIM_DISPLAYNAME: name
      PROXY_AUTOPROVISION_CLAIM_GROUPS: groups
      PROXY_ROLE_ASSIGNMENT_DRIVER: oidc
      PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM: ${OPENCLOUD_OIDC_ROLE_CLAIM}
      WEB_OIDC_CLIENT_ID: ${OPENCLOUD_OIDC_CLIENT_ID}
      WEB_OIDC_AUTHORITY: ${OPENCLOUD_OIDC_ISSUER}
      WEB_OIDC_METADATA_URL: ${OPENCLOUD_OIDC_ISSUER}/.well-known/openid-configuration
      WEB_OIDC_RESPONSE_TYPE: code
      WEB_OIDC_SCOPE: openid profile email groups
      GRAPH_USERNAME_MATCH: none
      GRAPH_ASSIGN_DEFAULT_USER_ROLE: "false"
      PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
    volumes:
      - ${OPENCLOUD_CONFIG_DIR:-/var/lib/opencloud/config}:/etc/opencloud
      - ${OPENCLOUD_DATA_DIR:-/var/lib/opencloud/data}:/var/lib/opencloud
      - ${OPENCLOUD_USER_FILES_DIR}:/host/user-files
      - ${OPENCLOUD_CSP_FILE}:/etc/opencloud/csp.yaml:ro
    extra_hosts:
      - "${OPENCLOUD_HOST_DOMAIN}:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
