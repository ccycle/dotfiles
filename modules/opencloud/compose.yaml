name: opencloud

services:
  opencloud:
    image: opencloudeu/opencloud-rolling:latest
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["-c", "opencloud init --insecure true || true; opencloud server"]
    ports:
      - "9200:9200"
    environment:
      OC_URL: ${OPENCLOUD_URL}
      PROXY_TLS: "false"
      OC_INSECURE: "true"
      IDM_ADMIN_PASSWORD: "${OPENCLOUD_ADMIN_PASSWORD}"
      OC_LOG_LEVEL: info
      STORAGE_USERS_DRIVER: ocis
      STORAGE_METADATA_DRIVER: ocis
    volumes:
      - ${OPENCLOUD_CONFIG_DIR:-/var/lib/opencloud/config}:/etc/opencloud
      - ${OPENCLOUD_DATA_DIR:-/var/lib/opencloud/data}:/var/lib/opencloud
    extra_hosts:
      - "${OPENCLOUD_HOST_DOMAIN}:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always
