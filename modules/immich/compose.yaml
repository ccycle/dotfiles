name: immich

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    ports:
      - "127.0.0.1:2283:2283"
      # Metrics ports remapped: host 8081 is taken by cAdvisor, 8082 by the
      # GitLab sidekiq metrics server.
      - "127.0.0.1:8091:8081" # API metrics
      - "127.0.0.1:8092:8082" # microservices metrics
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_SERVER_URL: ${IMMICH_SERVER_URL}
      IMMICH_TELEMETRY_INCLUDE: all
    volumes:
      - ${IMMICH_UPLOAD_DIR}:/usr/src/app/upload
    depends_on:
      - redis
      - database
    extra_hosts:
      - "${IMMICH_HOST_DOMAIN}:host-gateway"
    restart: always

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model_cache:/cache
    restart: always

  redis:
    image: redis:6.2-alpine
    restart: always

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
    volumes:
      - ${IMMICH_DB_DIR}:/var/lib/postgresql/data
    restart: always

volumes:
  model_cache:
