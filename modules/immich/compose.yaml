name: immich

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    ports:
      - "127.0.0.1:2283:2283"
      # Metrics ports remapped: host 8081 is taken by cAdvisor, 8082 by the
      # GitLab sidekiq metrics server.
      - "127.0.0.1:8091:8081" # API metrics
      - "127.0.0.1:8092:8082" # microservices metrics
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_SERVER_URL: ${IMMICH_SERVER_URL}
      IMMICH_TELEMETRY_INCLUDE: all
    volumes:
      - ${IMMICH_UPLOAD_DIR}:/usr/src/app/upload
    depends_on:
      - redis
      - database
    extra_hosts:
      - "${IMMICH_HOST_DOMAIN}:host-gateway"
    restart: always

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model_cache:/cache
    restart: always

  redis:
    image: redis:6.2-alpine
    restart: always

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
    volumes:
      - ${IMMICH_DB_DIR}:/var/lib/postgresql/data
    restart: always

  # Neither bundled image ships a Prometheus exporter (unlike GitLab
  # Omnibus), so availability is instrumented the same way GitLab's is:
  # one sidecar exporter per dependency, published on the host so the
  # monitoring stack's Prometheus can scrape it via host-gateway.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://immich:${IMMICH_DB_PASSWORD}@database:5432/immich?sslmode=disable"
    ports:
      # Host ports 9187/9121 are taken by GitLab's own postgres/redis
      # exporters; remapped here to stay unique across stacks.
      - "127.0.0.1:9188:9187"
    depends_on:
      - database
    restart: always

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "127.0.0.1:9122:9121"
    depends_on:
      - redis
    restart: always

volumes:
  model_cache:
