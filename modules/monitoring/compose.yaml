name: monitoring

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ${MONITORING_DATA_DIR:-/var/lib/monitoring}/prometheus:/prometheus
      - ${PROMETHEUS_CONFIG}:/etc/prometheus/prometheus.yml:ro
      - ${PROMETHEUS_RULES}:/etc/prometheus/rules.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    extra_hosts:
      - "host-gateway:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3200:3000"
    volumes:
      # Named volume, not a host bind: grafana.db is SQLite, and this stack
      # measured SQLite on virtiofs bind mounts crashing with SQLITE_BUSY /
      # SQLITE_IOERR_SHMLOCK under concurrent access (see design.md and
      # modules/pocket-id/design.md). Prometheus and Loki keep their host
      # binds below since neither uses SQLite.
      - grafana-data:/var/lib/grafana
      - ${GRAFANA_PROVISIONING_DIR}:/etc/grafana/provisioning:ro
      - ${GRAFANA_DASHBOARDS_DIR}:/var/lib/grafana/dashboards:ro
      # Caddy internal CA certificate for OIDC token exchange with Pocket ID
      - /var/lib/caddy/caddy/pki/authorities/${HOSTNAME}/root.crt:/etc/ssl/certs/caddy-ca.crt:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      # OIDC (Pocket ID)
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Pocket ID
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GRAFANA_OIDC_ISSUER}/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${GRAFANA_OIDC_ISSUER}/api/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: ${GRAFANA_OIDC_ISSUER}/api/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE: "true"
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  loki:
    image: grafana/loki:latest
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ${MONITORING_DATA_DIR:-/var/lib/monitoring}/loki:/loki
      - ${LOKI_CONFIG}:/etc/loki/local-config.yaml:ro
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    restart: always

  alloy:
    image: grafana/alloy:latest
    volumes:
      - ${ALLOY_CONFIG}:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log/host:ro
      # GitLab writes its real logs (rails, sidekiq, gitaly, ...) to this
      # host directory, not to the container's stdout. Empty fallback dir
      # keeps the stack working when GitLab is disabled.
      - ${GITLAB_LOGS_DIR:-/var/empty}:/var/log/gitlab-host:ro
    command:
      - "run"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always

volumes:
  grafana-data:
    name: grafana-data
