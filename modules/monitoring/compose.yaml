name: monitoring

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ${MONITORING_DATA_DIR:-/var/lib/monitoring}/prometheus:/prometheus
      - ${PROMETHEUS_CONFIG}:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    extra_hosts:
      - "host-gateway:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${MONITORING_DATA_DIR:-/var/lib/monitoring}/grafana:/var/lib/grafana
      - ${GRAFANA_PROVISIONING_DIR}:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.mac-mini-m4.internal
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: always

  loki:
    image: grafana/loki:latest
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ${MONITORING_DATA_DIR:-/var/lib/monitoring}/loki:/loki
      - ${LOKI_CONFIG}:/etc/loki/local-config.yaml:ro
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    restart: always

  alloy:
    image: grafana/alloy:latest
    volumes:
      - ${ALLOY_CONFIG}:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log:/var/log/host:ro
    command:
      - "run"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki
    restart: always

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
