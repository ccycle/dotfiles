# Webhook-only: see modules/monitoring/design.md for why Alertmanager
# exists here at all (the "no Alertmanager" non-goal is scoped down to
# exclude firing-webhook detection, not lifted generally). No notification
# integration is configured - the single receiver is a local HTTP webhook
# that wakes modules/llm-server/self-healing's daemon; nothing pages a
# human here.
route:
  receiver: self-healing-webhook
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: self-healing-webhook
    webhook_configs:
      - url: http://host-gateway:9096/alert
        send_resolved: false
