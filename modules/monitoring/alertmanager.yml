route:
  receiver: self-healing-webhook
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: ntfy
      continue: true
    - receiver: self-healing-webhook

receivers:
  - name: self-healing-webhook
    webhook_configs:
      - url: http://host-gateway:9096/alert
        send_resolved: false
  - name: ntfy
    webhook_configs:
      - url_file: /etc/alertmanager/notify-url
        send_resolved: true
        http_config:
          tls_config:
            ca_file: /etc/alertmanager/notify-ca.pem
