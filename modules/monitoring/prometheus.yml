global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

# Cross-stack targets are scraped via host-gateway: each service stack
# publishes its metrics ports on the host's 127.0.0.1, which OrbStack makes
# reachable from containers through the host-gateway extra_host.
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Host-level (macOS) metrics from the native node_exporter launchd
  # daemon, loopback-bound on 9100 (see options.nix). Same
  # host-gateway pattern as Caddy's loopback metrics port below.
  - job_name: "node-exporter"
    static_configs:
      - targets: ["host-gateway:9100"]

  # Caddy exposes /metrics on a dedicated loopback-only port (9091) rather
  # than the admin API, which is disabled.
  - job_name: "caddy"
    static_configs:
      - targets: ["host-gateway:9091"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "immich-api"
    static_configs:
      - targets: ["host-gateway:8091"]

  - job_name: "immich-microservices"
    static_configs:
      - targets: ["host-gateway:8092"]

  # Metrics live on the proxy's debug port (PROXY_DEBUG_ADDR), not 9200.
  - job_name: "opencloud"
    static_configs:
      - targets: ["host-gateway:9205"]

  - job_name: "immich-postgres"
    static_configs:
      - targets: ["host-gateway:9188"]

  - job_name: "immich-redis"
    static_configs:
      - targets: ["host-gateway:9122"]

  # Forgejo serves /metrics on its web port (127.0.0.1:3000), enabled via
  # FORGEJO__metrics__ENABLED. Metrics are aggregate counters; no bearer token.
  - job_name: "forgejo"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host-gateway:3000"]

  # GitLab jobs removed: services.gitlab.enable is false on all hosts.
  # Restore from git history if GitLab is re-enabled.

  # Attic cache metrics from the attic-exporter (Python HTTP server on 9201).
  # Queries the atticd SQLite database on each scrape for cache size, dedup
  # ratio, and access patterns.
  - job_name: "attic-exporter"
    static_configs:
      - targets: ["host-gateway:9201"]
