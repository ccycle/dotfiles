global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

# Cross-stack targets are scraped via host-gateway: each service stack
# publishes its metrics ports on the host's 127.0.0.1, which OrbStack makes
# reachable from containers through the host-gateway extra_host.
scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "immich-api"
    static_configs:
      - targets: ["host-gateway:8091"]

  - job_name: "immich-microservices"
    static_configs:
      - targets: ["host-gateway:8092"]

  # Metrics live on the proxy's debug port (PROXY_DEBUG_ADDR), not 9200.
  - job_name: "opencloud"
    static_configs:
      - targets: ["host-gateway:9205"]

  - job_name: "immich-postgres"
    static_configs:
      - targets: ["host-gateway:9188"]

  - job_name: "immich-redis"
    static_configs:
      - targets: ["host-gateway:9122"]

  - job_name: "gitlab-rails"
    metrics_path: "/-/metrics"
    static_configs:
      - targets: ["host-gateway:8929"]

  - job_name: "gitlab-sidekiq"
    static_configs:
      - targets: ["host-gateway:8082"]

  - job_name: "gitlab-postgres"
    static_configs:
      - targets: ["host-gateway:9187"]

  - job_name: "gitlab-redis"
    static_configs:
      - targets: ["host-gateway:9121"]

  # gitlab_exporter's /sidekiq is the only source of queue backlog metrics
  # (sidekiq_queue_size / sidekiq_queue_latency_seconds); the sidekiq metrics
  # server above only reports job execution.
  - job_name: "gitlab-exporter-sidekiq"
    metrics_path: "/sidekiq"
    static_configs:
      - targets: ["host-gateway:9168"]
