# Alert rules are evaluated without an Alertmanager: no notifications are
# sent. Firing state is the machine-readable triage entry point, queryable at
# http://127.0.0.1:9090/api/v1/alerts (see the investigate-service skill).
groups:
  - name: availability
    rules:
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} ({{ $labels.instance }}) is down"

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{container_label_com_docker_compose_project!=""}[30m]) > 2
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarted more than twice in 30m"

  - name: gitlab
    rules:
      - alert: GitLabPostgresDown
        expr: pg_up{job="gitlab-postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "GitLab bundled PostgreSQL is unreachable from postgres_exporter"

      - alert: GitLabRedisDown
        expr: redis_up{job="gitlab-redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "GitLab bundled Redis is unreachable from redis_exporter"

      - alert: GitLabSidekiqJobsFailing
        expr: increase(sidekiq_jobs_failed_total[10m]) > 10
        labels:
          severity: warning
        annotations:
          summary: 'Sidekiq failed {{ $value | printf "%.0f" }} jobs in the last 10m'

      - alert: GitLabSidekiqQueueBacklog
        expr: sidekiq_queue_size > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Sidekiq queue {{ $labels.name }} has {{ $value | printf "%.0f" }} pending jobs'

  - name: immich
    rules:
      # immich-server exposes http_server_response_count_total with a status
      # label (IMMICH_TELEMETRY_INCLUDE=all); this is the only user-facing
      # symptom signal currently available (job queue depth isn't exposed
      # upstream, only in-flight active count, so it isn't alertable).
      - alert: ImmichAPIErrorRate
        expr: increase(http_server_response_count_total{job="immich-api", status=~"5.."}[10m]) > 5
        labels:
          severity: warning
        annotations:
          summary: 'Immich API returned {{ $value | printf "%.0f" }} 5xx responses in the last 10m'

      - alert: ImmichPostgresDown
        expr: pg_up{job="immich-postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Immich PostgreSQL is unreachable from postgres_exporter"

      - alert: ImmichRedisDown
        expr: redis_up{job="immich-redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Immich Redis is unreachable from redis_exporter"

  - name: forgejo
    rules:
      # Forgejo exposes no HTTP traffic/error metrics (verified live on 11.x:
      # only gitea_* instance stats plus Go/process runtime), so availability
      # and restart signals are covered by the generic ScrapeTargetDown and
      # ContainerRestarting rules. The one distinct alertable signal is
      # process file-descriptor pressure.
      - alert: ForgejoFileDescriptorPressure
        expr: process_open_fds{job="forgejo"} / process_max_fds{job="forgejo"} > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Forgejo is using {{ $value | printf "%.0f" }}% of its file descriptor limit'
