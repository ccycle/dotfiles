groups:
  - name: availability
    rules:
      - alert: EndpointDown
        expr: probe_success{job="endpoint-probe"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} has failed its reachability probe for 5 minutes"

      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Scrape target {{ $labels.job }} ({{ $labels.instance }}) is down"

      - alert: ContainerRestarting
        expr: changes(container_start_time_seconds{container_label_com_docker_compose_project!=""}[30m]) > 2
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarted more than twice in 30m"

      - alert: TextfileCollectorParseError
        expr: node_textfile_scrape_error == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "node_exporter cannot parse a .prom file in its textfile dir; see /var/log/node-exporter.log"

      - alert: TextfileMetricStale
        expr: time() - node_textfile_mtime_seconds{file!~".*/(kiac_resume|self_healing_heartbeat)\\.prom"} > 172800
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.file }} has not been rewritten in over 2 days; its writer job is failing"

  - name: gitlab
    rules:
      - alert: GitLabPostgresDown
        expr: pg_up{job="gitlab-postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "GitLab bundled PostgreSQL is unreachable from postgres_exporter"

      - alert: GitLabRedisDown
        expr: redis_up{job="gitlab-redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "GitLab bundled Redis is unreachable from redis_exporter"

      - alert: GitLabSidekiqJobsFailing
        expr: increase(sidekiq_jobs_failed_total[10m]) > 10
        labels:
          severity: warning
        annotations:
          summary: 'Sidekiq failed {{ $value | printf "%.0f" }} jobs in the last 10m'

      - alert: GitLabSidekiqQueueBacklog
        expr: sidekiq_queue_size > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Sidekiq queue {{ $labels.name }} has {{ $value | printf "%.0f" }} pending jobs'

  - name: immich
    rules:
      # immich-server exposes http_server_response_count_total with a status
      # label (IMMICH_TELEMETRY_INCLUDE=all); this is the only user-facing
      # symptom signal currently available (job queue depth isn't exposed
      # upstream, only in-flight active count, so it isn't alertable).
      - alert: ImmichAPIErrorRate
        expr: increase(http_server_response_count_total{job="immich-api", status=~"5.."}[10m]) > 5
        labels:
          severity: warning
        annotations:
          summary: 'Immich API returned {{ $value | printf "%.0f" }} 5xx responses in the last 10m'

      - alert: ImmichPostgresDown
        expr: pg_up{job="immich-postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Immich PostgreSQL is unreachable from postgres_exporter"

      - alert: ImmichRedisDown
        expr: redis_up{job="immich-redis"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Immich Redis is unreachable from redis_exporter"

  - name: forgejo
    rules:
      # Forgejo exposes no HTTP traffic/error metrics (verified live on 11.x:
      # only gitea_* instance stats plus Go/process runtime), so availability
      # and restart signals are covered by the generic ScrapeTargetDown and
      # ContainerRestarting rules. The one distinct alertable signal is
      # process file-descriptor pressure.
      - alert: ForgejoFileDescriptorPressure
        expr: process_open_fds{job="forgejo"} / process_max_fds{job="forgejo"} > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Forgejo is using {{ $value | printf "%.0f" }}% of its file descriptor limit'

  - name: attic
    rules:
      - alert: AtticCapacityHigh
        expr: attic_cache_nars_bytes > 20e9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Attic cache logical size is {{ $value | humanize1024 }}B (threshold: 20GiB)"

      - alert: AtticSqliteSizeHigh
        expr: attic_cache_sqlite_bytes > 300e6
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Attic SQLite database is {{ $value | humanize1024 }}B (threshold: 300MB)"

  - name: self-healing
    rules:
      # Dead-man's-switch: self_healing_last_run_timestamp_seconds is
      # written by the daemon itself after every run (poll- or
      # webhook-triggered - see modules/llm-server/self-healing). This
      # never triggers remediation - only a log line + the Grafana
      # heartbeat panel, per design.md.
      - alert: SelfHealingHeartbeatMissing
        expr: time() - self_healing_last_run_timestamp_seconds > 100000
        labels:
          severity: warning
        annotations:
          summary: "self-healing daemon has not completed a run in over ~28h"

  - name: kiac
    rules:
      - alert: KiacResumeFailed
        expr: kiac_resume_exit_code != 0
        labels:
          severity: critical
        annotations:
          summary: "kiac-resume exited with code {{ $value }} (see /var/log/kiac-resume.log)"

      - alert: KiacResumeNotRunSinceBoot
        expr: kiac_resume_end_timestamp_seconds < node_boot_time_seconds
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "kiac-resume has not finished since the last host boot"

      - alert: KiacClusterUnhealthy
        expr: >-
          kiac_runtime_up == 0 or kiac_node_ready == 0 or kiac_node_dns_ok == 0
          or kiac_kube_system_pods_not_running > 0 or kiac_kube_system_pods == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "kiac homelab is unhealthy ({{ $labels.__name__ }}); check the kiac_* gauges"

      - alert: KiacHealthProbeStale
        expr: time() - kiac_health_probe_timestamp_seconds > 300
        labels:
          severity: warning
        annotations:
          summary: "kiac-health has not written a probe in over 5 minutes"

  - name: comin
    rules:
      - alert: CominDeploymentFailed
        expr: comin_last_eval_failed + comin_last_build_failed + comin_last_deployment_failed > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "comin eval, build, or activation is failing; see comin status and /var/log/comin.log"

      - alert: CominBehindMain
        expr: >-
          min without (remote_name) (comin_last_fetch_failed) == 1
          or comin_is_suspended == 1
          or sum without (remote_name, status) (increase(comin_fetch_count[30m])) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "comin has stopped picking up new commits (every remote failing, suspended, or no fetch in 30m)"

  - name: host
    rules:
      - alert: HostCpuSaturated
        expr: 1 - avg without (cpu, mode) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU has been over 90% busy for 30m"

      - alert: HostMemoryPressure
        expr: (node_memory_wired_bytes + node_memory_active_bytes + node_memory_compressed_bytes) / node_memory_total_bytes > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host memory in use (wired + active + compressed) has been over 90% for 15m"

      - alert: HostVolumeAlmostFull
        expr: 1 - node_filesystem_avail_bytes{fstype="apfs",mountpoint=~"/System/Volumes/Data|/nix|/Volumes/(WD_BLACK.*|TB4-TimeMachine)"} / node_filesystem_size_bytes{fstype="apfs",mountpoint=~"/System/Volumes/Data|/nix|/Volumes/(WD_BLACK.*|TB4-TimeMachine)"} > 0.9
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} is over 90% full"

      - alert: HostVolumeWillFillIn24h
        expr: predict_linear(node_filesystem_avail_bytes{fstype="apfs",mountpoint=~"/System/Volumes/Data|/nix|/Volumes/(WD_BLACK.*|TB4-TimeMachine)"}[6h], 86400) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} will run out of space within 24h at the last 6h's rate"

      - alert: HostThermalPressureHigh
        expr: thermal_pressure_level >= 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "macOS thermal pressure has been Heavy or worse for 10m"

  - name: launchd
    rules:
      - alert: LaunchdJobNotLoaded
        expr: launchd_job_loaded == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "launchd job {{ $labels.label }} ({{ $labels.domain }}) is defined in this repo but not loaded"

      - alert: LaunchdKeepAliveJobDown
        expr: launchd_job_running{keepalive="true"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "KeepAlive launchd job {{ $labels.label }} ({{ $labels.domain }}) has had no process for 5m"

      - alert: LaunchdJobFailed
        expr: launchd_job_last_exit_status{keepalive="false"} != 0
        labels:
          severity: warning
        annotations:
          summary: "launchd job {{ $labels.label }} ({{ $labels.domain }}) last exited with status {{ $value }}"
