name: Test OpenCloud (pocket-id passkey)

on:
  push:
    branches:
      - "**"
    # The suite exercises these modules directly, and its per-worktree state
    # (ports, admin password, API key, OIDC client id) lives under
    # tests/e2e/ which this gate also watches. See tests/e2e/design.md.
    paths:
      - modules/opencloud/**
      - modules/pocket-id/**
      - tests/e2e/**
      - flake.nix
  pull_request:
    paths:
      - modules/opencloud/**
      - modules/pocket-id/**
      - tests/e2e/**
      - flake.nix

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencloud-e2e:
    name: OpenCloud + pocket-id passkey e2e
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # This is the only E2E suite that needs a one-time manual bootstrap:
      # pocket-id has no API path to create an admin account or register the
      # first passkey by design (see modules/pocket-id/design.md). The very
      # first run on this runner therefore fails until someone performs the
      # setup once via its browser (admin account -> passkey -> copy API key),
      # after which stack.sh persists everything into tests/e2e/.env and every
      # subsequent CI run reuses it automatically. See
      # .agents/skills/e2e-test-opencloud for the manual procedure.

      # Caddy's internal CA must be copied onto the host with sudo before the
      # test-Caddy can mint trusted certs; see attic-credentials skill. This is
      # handled as part of the runner/host, not by the workflow itself.

      # Also required on this Mac Actions instance but assumed present: Tailscale
      # running (`stack.sh` resolves tailscale IP) so the per-worktree vhosts are
      # reachable exactly like production.

      - name: Run OpenCloud + pocket-id passkey E2E suite
        run: ./.agents/skills/e2e-test-opencloud/scripts/run.sh
        timeout-minutes: 90
