name: Verify

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax + Structure + Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the gate below can diff against origin/main.
          fetch-depth: 0

      # Path gate replacing the old paths-ignore lists: skill-only, docs-only,
      # and similar changes skip the heavy steps, but the job itself still
      # succeeds so the required "Verify / ..." context always reports.
      # (Forgejo, unlike GitHub, blocks merges on required checks that never
      # run, so paths-ignore on the trigger permanently blocks such PRs.)
      - name: Detect relevant changes
        id: gate
        run: |
          CHANGED=$(git diff --name-only origin/main...HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qvE '\.md$|^docs/|^issues/|^.agents/skills/|^modules/agents/skills/[^/]+/|^.claude/'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      # This runner IS mac-mini-m4-pro, but a CI checkout has no real
      # attached volumes to point custom.storage.volumes at - unlike a real
      # deployment of this host, which always has .local/storage from
      # scripts/setup-local-storage.sh. Writing this placeholder here,
      # explicitly, keeps check.sh's own logic untouched (it already treats
      # a present .local/storage as "the current host's real machine state"
      # for every other caller) rather than having it guess when a fallback
      # is appropriate.
      - name: Provide placeholder storage config for CI
        if: steps.gate.outputs.relevant == 'true'
        run: |
          mkdir -p .local/storage/vol
          cat > .local/storage/flake.nix <<EOF
          {
            outputs = { ... }: {
              darwinModules.default = { ... }: {
                custom.storage.volumes = {
                  forgejo = "$(pwd)/.local/storage/vol";
                  gitlab = "$(pwd)/.local/storage/vol";
                  immich = "$(pwd)/.local/storage/vol";
                  llm-server = "$(pwd)/.local/storage/vol";
                  monitoring = "$(pwd)/.local/storage/vol";
                  navidrome = "$(pwd)/.local/storage/vol";
                  opencloud = "$(pwd)/.local/storage/vol";
                };
              };
            };
          }
          EOF

      - name: Run verify-change
        if: steps.gate.outputs.relevant == 'true'
        run: .agents/skills/verify-change/scripts/check.sh

      # Requires this runner's System keychain to trust the Caddy internal CA
      # for https://cache.mac-mini-m4-pro.internal (see .agents/skills/attic-credentials
      # for the manual CA-trust step - security add-trusted-cert on the
      # System keychain triggers a GUI SecurityAgent prompt, so this has to
      # be done once via Screen Sharing/console login, not SSH).
      - name: Build and push to Attic
        if: steps.gate.outputs.relevant == 'true'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_CI_TOKEN }}
        run: |
          OUT_PATHS=$(nix build \
            .#darwinConfigurations.mac-mini-m4-pro.system \
            .#darwinConfigurations.mac-mini-m4.system \
            --impure --no-update-lock-file --print-out-paths \
            --override-input storage-config "path:$(pwd)/.local/storage" \
            --override-input dotfiles-config "path:$(pwd)/.local/dotfiles" \
            --override-input user-config "path:$(pwd)/.local/user")
          nix run github:zhaofengli/attic -- login dotfiles-ci \
            https://cache.mac-mini-m4-pro.internal "$ATTIC_TOKEN" --set-default
          if ! nix run github:zhaofengli/attic -- push dotfiles $OUT_PATHS; then
            echo "Warning: attic push failed; cache not updated. Build itself succeeded." >&2
          fi
