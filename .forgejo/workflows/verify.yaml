name: Verify

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'issues/**'
      - '.agents/skills/**'
      - 'modules/agents/skills/*/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'issues/**'
      - '.agents/skills/**'
      - 'modules/agents/skills/*/**'
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax + Structure + Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate env.nix
        run: |
          mkdir -p generated
          echo '{ username = "runner"; homeDirectory = "/Users/runner"; }' > generated/env.nix

      - name: Run verify-change
        run: .agents/skills/verify-change/scripts/check.sh

      # Assumes this runner's keychain already trusts the Caddy internal CA
      # for https://cache.mac-mini-m4-pro.internal (see .agents/skills/attic-credentials
      # for the manual CA-trust step). Unverified for the actual Forgejo runner.
      - name: Build and push to Attic
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_CI_TOKEN }}
        run: |
          OUT_PATHS=$(nix build \
            .#darwinConfigurations.mac-mini-m4-pro.system \
            .#darwinConfigurations.mac-mini-m4.system \
            --impure --no-update-lock-file --print-out-paths)
          nix run github:zhaofengli/attic -- login dotfiles-ci \
            https://cache.mac-mini-m4-pro.internal "$ATTIC_TOKEN" --set-default
          nix run github:zhaofengli/attic -- push dotfiles $OUT_PATHS
